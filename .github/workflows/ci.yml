name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            pluginval_zip: pluginval_Windows.zip
            pluginval_bin: ./pluginval.exe
          - name: macOS
            os: macos-latest
            pluginval_zip: pluginval_macOS.zip
            pluginval_bin: ./pluginval.app/Contents/MacOS/pluginval

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Download pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval_zip }}"
          unzip -q pluginval.zip

      - name: Validate VST3
        shell: bash
        run: |
          ${{ matrix.pluginval_bin }} --strictness-level 5 --validate-in-process --skip-gui-tests \
            "build/Curvable_artefacts/Release/VST3/Curvable.vst3"

      - name: Validate AU
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/Curvable_artefacts/Release/AU/Curvable.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Crv1 Crvb

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: Curvable-${{ matrix.name }}
          path: |
            build/Curvable_artefacts/Release/VST3
            build/Curvable_artefacts/Release/AU
          if-no-files-found: ignore
